# The hearths: kin groups, and what happens between them.
#
# Keyed on the household layer rather than on the clan average, because the average is a
# question about nobody. A clan at five morale with one hearth at zero is a different clan from
# one where everybody is at five, and `worst_household_mood` is what tells them apart.
#
# The rationing decision is the only place the player touches this directly, and it only
# appears when the store is short. These are how the layer shows up the rest of the time.

[[event]]
id = "hearth.the_quiet_one"
weight = 4
when = ["worst_household_mood < 3", "households > 1"]
title = "The Quiet Hearth"
body = """
One fire in the camp is not talking. They do the work, they take their share, they answer when
spoken to and not otherwise. Everybody has noticed and everybody has decided it is not theirs
to fix.
"""

  [[event.choice]]
  text = "Eat with them. Once, publicly, and stay until it is awkward."
  [event.choice.effect]
  morale = 1

  [[event.choice]]
  text = "Leave them to it. People come round in their own time."
  [event.choice.effect]
  morale = -1

# Three entries were cut from here in slice 6 because `households_resentful` was measurably
# unreachable: the meter only moved when a hearth was passed over, so the highest any hearth
# ever reached was the threshold itself, at the very end of runs. Slice 4 fixed the accrual (a
# hearth that buries somebody *while another fire eats* now resents it) and gave resentment two
# rungs, and the entries below are what that bought. They are keyed on
# `worst_household_resentment` rather than on the count, because a grudge is about one hearth.

[[event]]
id = "hearth.the_longest_memory"
weight = 4
when = ["worst_household_resentment > 2", "households > 1"]
title = "The Longest Memory"
body = """
One fire in this camp has been fed last often enough to have stopped expecting anything else.
Nobody there says so. It is in how they take a bowl and how they say thank you for it.
"""

  [[event.choice]]
  text = "Sit with them. Hear the whole list, including the parts you remember differently."
  [event.choice.effect]
  morale = -1
  [event.choice.effect.household]
  resentment = -2
  mood = 1

  [[event.choice]]
  text = "Nothing to be done about it now. The store is the store."
  [event.choice.effect]
  [event.choice.effect.household]
  resentment = 1

[[event]]
id = "hearth.they_take_theirs"
weight = 5
when = ["households_hoarding > 0"]
title = "They Take Theirs"
body = """
The far hearth no longer waits to be dealt a share. They come to the store first, take what
they judge is theirs, and are gone before the argument starts. What you divide tonight is what
they left.
"""

  [[event.choice]]
  text = "Let it stand. A fight over a bowl is how a clan comes apart."
  [event.choice.effect]
  morale = -1

  [[event.choice]]
  text = "Take it back off them in front of everyone."
  [event.choice.effect]
  food = 5
  morale = -2
  [event.choice.effect.household]
  resentment = 2

  [[event.choice]]
  text = "Give them more than they took, and say it was always theirs."
  [event.choice.effect]
  food = -6
  [event.choice.effect.household]
  resentment = -3
  mood = 2

[[event]]
id = "hearth.the_last_word_before_going"
weight = 6
when = ["worst_household_resentment > 4", "households > 1"]
title = "They Have Stopped Asking"
body = """
They have not raised anything at the fire in a season. There is a bundle by their door that
has been packed and unpacked twice, and everybody in the camp has walked past it and said
nothing, including you.
"""

  [[event.choice]]
  text = "Ask them, plainly, in front of everyone, to stay."
  [event.choice.effect]
  morale = 1
  [event.choice.effect.household]
  resentment = -3
  mood = 2

  [[event.choice]]
  text = "Give them the best of the store and no words at all."
  [event.choice.effect]
  food = -10
  [event.choice.effect.household]
  resentment = -4

  [[event.choice]]
  text = "Say nothing. If they are going they are going."
  [event.choice.effect]
  morale = -1
  [event.choice.effect.household]
  resentment = 1

[[event]]
id = "hearth.the_empty_place"
weight = 5
once = true
when = ["hearths_walked_out > 0"]
title = "The Empty Place"
body = """
Their fire is a ring of cold stones and the ground where they slept is still flattened. Nobody
has taken the space, though the camp is short of room, and nobody has said out loud that they
are not coming back.
"""

  [[event.choice]]
  text = "Break up the ring and use the stones. They are stones."
  [event.choice.effect]
  morale = -2
  [event.choice.effect.tally]
  ground_lost_to_fear = 1

  [[event.choice]]
  text = "Leave it where it is."
  [event.choice.effect]
  morale = 1

[[event]]
id = "hearth.the_new_fire"
weight = 3
when = ["people > 9", "households < 4"]
title = "A Fire Too Big"
body = """
There are more of them round that one fire than can sit at it, and the ones on the outside
have started eating standing up. Somebody is going to walk off and build their own, and
everybody has worked out who, including them.
"""
[event.effect]
morale = 1

[[event]]
id = "hearth.the_marriage"
weight = 3
when = ["households > 2", "morale > 5", "people > 7"]
title = "An Arrangement"
body = """
Two hearths have worked out between them that a son of one and a daughter of the other would
make a third, and have come to you with it settled, wanting only to be seen to ask.
"""

  [[event.choice]]
  text = "Say yes in front of everyone and make a night of it."
  [event.choice.effect]
  food = -8
  morale = 3

  [[event.choice]]
  text = "Say yes quietly. There is not the food for a night of it."
  [event.choice.effect]
  morale = 1

[[event]]
id = "hearth.who_holds_the_children"
weight = 3
when = ["children > 2", "worst_household_mood < 5"]
title = "Who Holds the Children"
body = """
The young ones have been drifting to the fire that feeds them best, which is not always the
fire they were born at, and the hearth they are drifting away from has started to notice
before you did.
"""

  [[event.choice]]
  text = "Say nothing. Children go where they are fed."
  [event.choice.effect]
  morale = -1

  [[event.choice]]
  text = "Send them back to their own fire, and send food with them."
  [event.choice.effect]
  food = -6
  morale = 1

[[event]]
id = "hearth.one_left"
weight = 4
when = ["households == 1", "year > 1"]
title = "One Fire Left"
body = """
There was more than one, and now there is not. What is left is a single fire with room around
it, and everybody sitting closer to it than they need to.
"""
[event.effect]
morale = -2

[[event]]
id = "hearth.the_full_camp"
weight = 3
once = true
when = ["people > 10", "households > 2", "morale > 4"]
title = "A Camp, Not a Camp Fire"
body = """
Voices at every fire, and somebody at the edge of it who has to raise their own to be heard
across the middle. It has been a while since a stranger walking in would have called this a
family.
"""
[event.effect]
morale = 2

[[event]]
id = "hearth.hands_at_the_worst_fire"
weight = 2
when = ["worst_household_mood < 2", "food > 20"]
title = "The Worst Fire"
body = """
There is a hearth here that has not had a good season in living memory, and the store, for
once, is not the problem. Nothing is stopping you from simply giving them more than their
share except every other fire in the camp.
"""

  [[event.choice]]
  text = "Give it to them anyway, openly, and take the cost in muttering."
  [event.choice.effect]
  food = -8
  morale = 1
  [event.choice.effect.tally]
  debts_owed_to_you = 1

  [[event.choice]]
  text = "Even shares. Whatever is wrong at that fire is not a food problem."
  [event.choice.effect]
