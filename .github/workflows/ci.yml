name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Both on their latest moving major tag, and both node24. v4/v5 targeted node20, which
      # the runner force-upgraded while printing a deprecation annotation on every run.
      # setup-uv publishes moving major tags only up to v7; v8 and v9 exist as exact versions
      # only, so v7 is the newest tag that still tracks patches.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      # The lockfile pins ruff and pyright alongside the runtime deps, so these are the same
      # binaries a developer gets from `uv run` locally.
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright src tests
      - run: PYTHONPATH=src uv run python -m unittest discover -s tests
