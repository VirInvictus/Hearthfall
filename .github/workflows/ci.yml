name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      # The lockfile pins ruff and pyright alongside the runtime deps, so these are the same
      # binaries a developer gets from `uv run` locally.
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright src tests
      - run: PYTHONPATH=src uv run python -m unittest discover -s tests
