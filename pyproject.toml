[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearthfall"
version = "0.1.1"
description = "A grimdark clan-survival game for the terminal"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "vrnvctss" },
]
# The engine takes no dependencies. Everything here belongs to the TUI skin.
dependencies = [
  "textual>=0.80",
]

[project.scripts]
hearthfall = "hearthfall.tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthfall"]

[tool.pyright]
# The package lives under src/ and tests run with PYTHONPATH=src, so the language server
# needs telling where to look or every intra-package import reads as unresolved.
extraPaths = ["src"]
